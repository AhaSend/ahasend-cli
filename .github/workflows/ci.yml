name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  # The toolchain line of go.mod; make check-versions checks it
  GO_VERSION: '1.27.2'
  GOTOOLCHAIN: 'go1.27.2'

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14
      - name: golangci-lint (Windows-only files)
        uses: golangci/golangci-lint-action@v8
        env:
          GOOS: windows
        with:
          version: v2.14
      - name: Check go.mod and go.sum are tidy
        run: make deps-check
      - name: Check THIRD_PARTY_NOTICES is current
        run: make notices-check
      - name: Check the Go and GoReleaser versions are the same everywhere
        run: make check-versions
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: make test-coverage-ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test ./...

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify build works
        run: go build -v -o ahasend .

      - name: Test binary
        run: ./ahasend --version

  release-check:
    name: Release check
    runs-on: ubuntu-latest
    steps:
      # The release scripts read the repository's tags
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # check-release-assets.sh lists the .rpm files with rpm
      - name: Install rpm
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Check the GoReleaser configuration
        run: scripts/goreleaser-check.sh

      - name: Build a snapshot of the release
        run: make release-snapshot SNAPSHOT_VERSION=99.0.0

      - name: Check the snapshot's assets
        run: |
          scripts/stage-release.sh dist "$RUNNER_TEMP/snapshot"
          scripts/check-release-assets.sh "$RUNNER_TEMP/snapshot"

      - name: Test the release scripts
        run: make test-scripts
