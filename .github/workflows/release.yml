name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  # The toolchain line of go.mod; make check-versions checks it
  GO_VERSION: '1.27.2'
  GOTOOLCHAIN: 'go1.27.2'
  # GORELEASER_VERSION of the Makefile; make check-versions checks it
  GORELEASER_VERSION: 'v2.18.3'

# Each job asks for the permissions it needs
permissions: {}

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The release scripts read the repository's tags
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Download dependencies
        run: go mod download

      # The release builds only after these pass, as CI checks them
      - name: Check go.mod and go.sum are tidy
        run: make deps-check

      - name: Check THIRD_PARTY_NOTICES is current
        run: make notices-check

      - name: Check the Go and GoReleaser versions are the same everywhere
        run: make check-versions

      - name: Run tests
        run: make test

      - name: Check the release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME"

      # check-release-assets.sh lists the .rpm files with rpm
      - name: Install rpm
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Check the GoReleaser configuration
        run: scripts/goreleaser-check.sh

      - name: Build a snapshot of the release
        run: make release-snapshot SNAPSHOT_VERSION=99.0.0

      - name: Check the snapshot's assets
        run: |
          scripts/stage-release.sh dist "$RUNNER_TEMP/snapshot"
          scripts/check-release-assets.sh "$RUNNER_TEMP/snapshot"

      - name: Test the release scripts
        run: make test-scripts

  goreleaser:
    name: Build and publish the GitHub release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # GIT_COMMIT and BUILD_TIME stamp the version; MAKE_LATEST marks only
      # the newest stable tag as the latest release
      - name: Prepare the release notes and build information
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          scripts/build-info.sh >> "$GITHUB_ENV"
          # Assigned first, so a failure stops the step instead of writing
          # an empty value, which GitHub would take as latest
          make_latest=$(scripts/make-latest.sh "$GITHUB_REF_NAME")
          echo "MAKE_LATEST=$make_latest" >> "$GITHUB_ENV"

      # The tag is named, so a commit that also has a pre-release tag builds
      # this tag's version
      - name: Build and publish the release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=homebrew,scoop,aur --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Collect the release assets
        run: scripts/stage-release.sh dist "$RUNNER_TEMP/release"

      - name: Attest the release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/*

  channels:
    name: Start the channel runs
    runs-on: ubuntu-latest
    # No channel for a tag whose GitHub release failed
    needs: goreleaser
    permissions:
      contents: read
      actions: write
    steps:
      # The release scripts read the repository's tags
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # One publish-channel.yml run per channel, so each channel fails or
      # succeeds on its own; a pre-release gets none. A failed start does not
      # stop the others; the step fails after trying them all.
      - name: Start a publish-channel.yml run for each channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Assigned first, so a failure stops the step
          channels=$(scripts/channels.sh "$GITHUB_REF_NAME")
          failed=
          for channel in $channels; do
            gh workflow run publish-channel.yml --ref "$GITHUB_REF_NAME" -f tag="$GITHUB_REF_NAME" -f channel="$channel" ||
              failed="$failed $channel"
          done
          if [ -n "$failed" ]; then
            echo "could not start publish-channel.yml for:$failed" >&2
            exit 1
          fi

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # No image for a tag whose GitHub release failed
    needs: goreleaser
    permissions:
      contents: read
      packages: write
    steps:
      # The release scripts read the repository's tags
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the build information and the image tags
        id: info
        run: |
          scripts/build-info.sh >> "$GITHUB_OUTPUT"
          tags=$(scripts/docker-tags.sh "$GITHUB_REF_NAME")
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/ahasend-cli"
          {
            echo 'TAGS<<EOF'
            echo "$tags" | sed "s|^|$image:|"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # QEMU runs the arm64 image's setup steps; Go cross-compiles the binary
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: env.DOCKER_USERNAME != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ steps.info.outputs.GIT_COMMIT }}
            BUILD_TIME=${{ steps.info.outputs.BUILD_TIME }}
          tags: ${{ steps.info.outputs.TAGS }}
          # GHCR shows the description and links of a multi-platform image
          # from its index annotations, and older tools read the labels
          labels: |
            org.opencontainers.image.title=AhaSend CLI
            org.opencontainers.image.description=Send email and manage your AhaSend account from the command line
            org.opencontainers.image.source=https://github.com/AhaSend/ahasend-cli
            org.opencontainers.image.documentation=https://ahasend.com/docs/cli
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.title=AhaSend CLI
            index:org.opencontainers.image.description=Send email and manage your AhaSend account from the command line
            index:org.opencontainers.image.source=https://github.com/AhaSend/ahasend-cli
            index:org.opencontainers.image.documentation=https://ahasend.com/docs/cli
            index:org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
