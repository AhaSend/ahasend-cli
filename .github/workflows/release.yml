name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  # The toolchain line of go.mod; make check-go-version checks it
  GO_VERSION: '1.27.2'

# Each job asks for the permissions it needs
permissions: {}

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Download dependencies
        run: go mod download

      # The release builds only after these pass, as CI checks them
      - name: Check go.mod and go.sum are tidy
        run: make deps-check

      - name: Check THIRD_PARTY_NOTICES is current
        run: make notices-check

      - name: Check the Go version is the same everywhere
        run: make check-go-version

      - name: Run tests
        run: make test

  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build all binaries
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: make build-all

      # The licence files are release assets too, so the checksums cover them
      - name: Generate checksums
        run: |
          cp LICENSE THIRD_PARTY_NOTICES bin/
          cd bin
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Generate changelog
        id: changelog
        run: |
          # Get the current tag
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"

          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $CURRENT_TAG^ 2>/dev/null || echo "")

          # Generate changelog
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            echo "## Changes since $PREVIOUS_TAG" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..$CURRENT_TAG >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            echo "## Initial Release" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "First release of AhaSend CLI" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: AhaSend CLI ${{ steps.version.outputs.VERSION }}
          body: |
            # AhaSend CLI ${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            Download the appropriate binary for your platform from the assets below.

            ### Linux (x86-64)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/ahasend-linux-amd64 -o ahasend
            chmod +x ahasend
            sudo mv ahasend /usr/local/bin/
            ```

            ### Linux (ARM64)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/ahasend-linux-arm64 -o ahasend
            chmod +x ahasend
            sudo mv ahasend /usr/local/bin/
            ```

            ### macOS (Intel)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/ahasend-darwin-amd64 -o ahasend
            chmod +x ahasend
            sudo mv ahasend /usr/local/bin/
            ```

            ### macOS (Apple Silicon)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/ahasend-darwin-arm64 -o ahasend
            chmod +x ahasend
            sudo mv ahasend /usr/local/bin/
            ```

            ### Windows
            Download `ahasend-windows-amd64.exe` (or `ahasend-windows-arm64.exe` on ARM64) and add it to your PATH.

            ## Checksums

            Please verify the checksums after downloading:
            ```
            sha256sum <downloaded-file>
            ```

            See `checksums.txt` in the release assets for the expected values.
          files: |
            bin/ahasend-linux-amd64
            bin/ahasend-linux-arm64
            bin/ahasend-darwin-amd64
            bin/ahasend-darwin-arm64
            bin/ahasend-windows-amd64.exe
            bin/ahasend-windows-arm64.exe
            bin/checksums.txt
            bin/LICENSE
            bin/THIRD_PARTY_NOTICES
          draft: false
          prerelease: false

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_WITHOUT_V=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "GIT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')" >> $GITHUB_OUTPUT
          echo "REPO_OWNER_LOWER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # QEMU runs the arm64 image's setup steps; Go cross-compiles the binary
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: env.DOCKER_USERNAME != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            GIT_COMMIT=${{ steps.version.outputs.GIT_COMMIT }}
            BUILD_TIME=${{ steps.version.outputs.BUILD_TIME }}
          tags: |
            ghcr.io/${{ steps.version.outputs.REPO_OWNER_LOWER }}/ahasend-cli:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ steps.version.outputs.REPO_OWNER_LOWER }}/ahasend-cli:${{ steps.version.outputs.VERSION_WITHOUT_V }}
            ghcr.io/${{ steps.version.outputs.REPO_OWNER_LOWER }}/ahasend-cli:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max