name: Packaging

# The install channel tests: they install the release assets of test
# snapshots, served by a fake release, on every platform the channels support
on:
  pull_request:
    paths:
      - '.goreleaser.yaml'
      - 'Makefile'
      - 'go.mod'
      - 'scripts/**'
      - 'npm/**'
      - 'packaging/**'
      - 'install.sh'
      - 'install.ps1'
      - 'test/install/**'
      - 'test/release/**'
      - '.github/workflows/**'

env:
  # The toolchain line of go.mod; make check-versions checks it
  GO_VERSION: '1.27.2'
  GOTOOLCHAIN: 'go1.27.2'
  # GORELEASER_VERSION of the Makefile; make check-versions checks it
  GORELEASER_VERSION: 'v2.18.3'
  # KOMAC_VERSION and KOMAC_SHA256 of the Makefile; make check-versions checks
  # them
  KOMAC_VERSION: 'v2.17.1'
  KOMAC_SHA256: 'e694e79cd451afabf47bead66ed34586fef4814f7b94e4b61a098f419978d5d7'
  # The channel tests serve the fake release here, and the snapshot's
  # formula, manifest and AUR files download from it
  FAKE_RELEASE_URL: 'http://127.0.0.1:8484'
  # The npm tests' registry and package managers
  VERDACCIO_VERSION: '5.33.0'
  PNPM_VERSION: '10.34.6'
  BUN_VERSION: '1.4.2'

permissions:
  contents: read

jobs:
  lint-install-scripts:
    name: Lint the install scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # checkbashisms comes with devscripts
      - name: Install shellcheck and checkbashisms
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck devscripts

      - name: Check the sh scripts
        run: |
          shellcheck -x -s sh install.sh scripts/*.sh test/install/*.sh test/release/*.sh
          checkbashisms install.sh scripts/*.sh test/install/*.sh test/release/*.sh

      - name: Check the Node scripts
        run: |
          for script in scripts/*.mjs npm/cli/bin/ahasend.js test/install/*.mjs test/install/*.cjs; do
            node --check "$script"
          done

      # Windows PowerShell 5.1 reads a download without a charset as
      # ISO-8859-1, so install.ps1 must be ASCII
      - name: Check that install.ps1 is ASCII
        run: |
          if [ -n "$(LC_ALL=C tr -d '\000-\177' < install.ps1)" ]; then
            LC_ALL=C grep -n -P '[^\x00-\x7F]' install.ps1 >&2
            echo "install.ps1 has bytes that are not ASCII" >&2
            exit 1
          fi

      # The script writes its messages for the user with Write-Host
      - name: Analyze install.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost
          $results | Format-Table -AutoSize -Wrap
          if ($results) {
            exit 1
          }

  fake-release:
    name: Build the fake release
    runs-on: ubuntu-latest
    steps:
      # The release scripts read the repository's tags
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A stable version, and an older pre-release for the upgrade and
      # pre-release cases. The stable one is built last, so dist/ keeps its
      # formula, manifest and AUR files, which download from the fake release.
      - name: Build the test snapshots
        env:
          AHASEND_RELEASES_URL: ${{ env.FAKE_RELEASE_URL }}
        run: |
          for version in 98.0.0-rc.1 99.0.0; do
            make release-snapshot SNAPSHOT_VERSION=$version
            scripts/stage-release.sh dist "$RUNNER_TEMP/release/v$version"
          done
          mkdir "$RUNNER_TEMP/channels"
          cp -R dist/homebrew dist/scoop dist/aur "$RUNNER_TEMP/channels/"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # As the npm job of publish-channel.yml does, from the fake release
      - name: Pack the npm packages
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/fake-release" ./test/install/fake-release
          sh test/install/npm-pack.sh "$RUNNER_TEMP/release" "$RUNNER_TEMP/fake-release" "$RUNNER_TEMP/npm-tarballs"

      - name: Upload the npm packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs
          retention-days: 1

      # The install scripts need only checksums.txt and the raw binaries
      - name: Upload the fake release
        uses: actions/upload-artifact@v4
        with:
          name: fake-release
          path: |
            ${{ runner.temp }}/release/*/checksums.txt
            ${{ runner.temp }}/release/*/ahasend-linux-*
            ${{ runner.temp }}/release/*/ahasend-darwin-*
            ${{ runner.temp }}/release/*/ahasend-windows-*
          retention-days: 1

      # The channel tests need the generated files, the archives, and the
      # assets the WinGet and Chocolatey scripts read; the artifact holds
      # channels/ and release/v99.0.0/
      - name: Upload the channel files
        uses: actions/upload-artifact@v4
        with:
          name: channel-files
          path: |
            ${{ runner.temp }}/channels
            ${{ runner.temp }}/release/v99.0.0/*.tar.gz
            ${{ runner.temp }}/release/v99.0.0/*.zip
            ${{ runner.temp }}/release/v99.0.0/checksums.txt
            ${{ runner.temp }}/release/v99.0.0/ahasend-windows-amd64.exe
            ${{ runner.temp }}/release/v99.0.0/LICENSE
            ${{ runner.temp }}/release/v99.0.0/THIRD_PARTY_NOTICES
          retention-days: 1

  install-sh:
    name: install.sh (${{ matrix.os }}, ${{ matrix.shell }})
    needs: fake-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # sh is dash on Ubuntu
          - os: ubuntu-latest
            shell: sh
          - os: ubuntu-latest
            shell: bash
          - os: ubuntu-24.04-arm
            shell: sh
          - os: macos-latest
            shell: sh
          - os: macos-15-intel
            shell: sh
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download the fake release
        uses: actions/download-artifact@v4
        with:
          name: fake-release
          path: ${{ runner.temp }}/release

      - name: Build the fake release server
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/fake-release" ./test/install/fake-release

      # The Rosetta case runs install.sh as an x86_64 process
      - name: Install Rosetta
        if: matrix.os == 'macos-latest'
        run: /usr/bin/arch -x86_64 /usr/bin/true 2> /dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Test install.sh
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: sh test/install/run.sh "$RUNNER_TEMP/release" "$RUNNER_TEMP/fake-release"

  install-sh-alpine:
    name: install.sh (Alpine, busybox sh)
    needs: fake-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download the fake release
        uses: actions/download-artifact@v4
        with:
          name: fake-release
          path: ${{ runner.temp }}/release

      # Static, so it runs in the Alpine container
      - name: Build the fake release server
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/fake-release" ./test/install/fake-release

      # Alpine has busybox sh and wget, and no curl; a user other than root
      # cannot write to a read-only directory
      - name: Test install.sh
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/release:/release:ro" \
            -v "$RUNNER_TEMP/fake-release:/fake-release:ro" -w /src \
            alpine:3.22 sh test/install/run.sh /release /fake-release

  install-ps1:
    name: install.ps1 (${{ matrix.os }}, ${{ matrix.shell }})
    needs: fake-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        # Windows PowerShell 5.1 and PowerShell 7
        shell: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download the fake release
        uses: actions/download-artifact@v4
        with:
          name: fake-release
          path: ${{ runner.temp }}/release

      - name: Build the fake release server
        run: go build -o "$env:RUNNER_TEMP\fake-release.exe" ./test/install/fake-release

      # Windows PowerShell needs TLS 1.2 and the NuGet provider to install
      # modules
      - name: Install Pester
        run: |
          if ($PSVersionTable.PSEdition -eq 'Desktop') {
            [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Test install.ps1
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $data = @{ Release = "$env:RUNNER_TEMP\release"; Server = "$env:RUNNER_TEMP\fake-release.exe" }
          $config = New-PesterConfiguration
          $config.Run.Container = New-PesterContainer -Path test/install/install.Tests.ps1 -Data $data
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  homebrew:
    name: Homebrew (${{ matrix.os }})
    needs: fake-release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download the channel files
        uses: actions/download-artifact@v4
        with:
          name: channel-files
          path: ${{ runner.temp }}/channel-files

      - name: Build the fake release server
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/fake-release" ./test/install/fake-release

      # The Ubuntu runners have Homebrew, but not on PATH
      - name: Put brew on PATH
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"

      - name: Test the Homebrew formula
        env:
          AHASEND_RELEASES_URL: ${{ env.FAKE_RELEASE_URL }}
        run: |
          sh test/install/homebrew.sh "$RUNNER_TEMP/channel-files/channels" \
            "$RUNNER_TEMP/channel-files/release" "$RUNNER_TEMP/fake-release"

  scoop:
    name: Scoop (windows-latest)
    needs: fake-release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download the channel files
        uses: actions/download-artifact@v4
        with:
          name: channel-files
          path: ${{ runner.temp }}/channel-files

      - name: Build the fake release server
        run: go build -o "$env:RUNNER_TEMP\fake-release.exe" ./test/install/fake-release

      # The runner is an administrator, which Scoop's installer refuses
      # without -RunAsAdmin
      - name: Install Scoop
        run: |
          $env:SCOOP = "$env:RUNNER_TEMP\scoop"
          "SCOOP=$env:SCOOP" >> $env:GITHUB_ENV
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin -ScoopDir $env:SCOOP
          "$env:SCOOP\shims" >> $env:GITHUB_PATH

      - name: Test the Scoop manifest
        env:
          AHASEND_RELEASES_URL: ${{ env.FAKE_RELEASE_URL }}
        run: |
          test/install/scoop.ps1 -Dist "$env:RUNNER_TEMP\channel-files\channels" `
            -Release "$env:RUNNER_TEMP\channel-files\release" -Server "$env:RUNNER_TEMP\fake-release.exe"

  aur:
    name: AUR (Arch Linux, x86_64)
    needs: fake-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download the channel files
        uses: actions/download-artifact@v4
        with:
          name: channel-files
          path: ${{ runner.temp }}/channel-files

      # Static, so it runs in the Arch Linux container
      - name: Build the fake release server
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/fake-release" ./test/install/fake-release

      # makepkg runs as a user other than root, who installs the package
      # with sudo
      - name: Test the AUR package
        run: |
          docker run --rm -e AHASEND_RELEASES_URL="$FAKE_RELEASE_URL" \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/channel-files:/files:ro" \
            -v "$RUNNER_TEMP/fake-release:/fake-release:ro" -w /src \
            archlinux:base-devel sh -c '
              pacman -Syu --noconfirm --needed namcap &&
              useradd -m builder &&
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder &&
              sudo -u builder --preserve-env=AHASEND_RELEASES_URL \
                sh test/install/aur.sh /files/channels /files/release /fake-release'

  winget:
    name: WinGet (windows-latest)
    needs: fake-release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download the channel files
        uses: actions/download-artifact@v4
        with:
          name: channel-files
          path: ${{ runner.temp }}/channel-files

      - name: Build the fake release server
        run: go build -o "$env:RUNNER_TEMP\fake-release.exe" ./test/install/fake-release

      - name: Fill in the manifests
        shell: bash
        env:
          AHASEND_RELEASES_URL: ${{ env.FAKE_RELEASE_URL }}
        run: |
          scripts/winget-manifest.sh v99.0.0 "$RUNNER_TEMP/channel-files/release/v99.0.0" "$RUNNER_TEMP/winget"

      - name: Test the WinGet manifests
        env:
          AHASEND_RELEASES_URL: ${{ env.FAKE_RELEASE_URL }}
        run: |
          test/install/winget.ps1 -Manifests "$env:RUNNER_TEMP\winget" `
            -Release "$env:RUNNER_TEMP\channel-files\release" -Server "$env:RUNNER_TEMP\fake-release.exe"

  chocolatey:
    name: Chocolatey (windows-latest)
    needs: fake-release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the channel files
        uses: actions/download-artifact@v4
        with:
          name: channel-files
          path: ${{ runner.temp }}/channel-files

      - name: Fill in the package
        shell: bash
        env:
          AHASEND_RELEASES_URL: ${{ env.FAKE_RELEASE_URL }}
        run: |
          scripts/choco-package.sh v99.0.0 "$RUNNER_TEMP/channel-files/release/v99.0.0" "$RUNNER_TEMP/chocolatey"

      - name: Test the Chocolatey package
        env:
          AHASEND_RELEASES_URL: ${{ env.FAKE_RELEASE_URL }}
        run: |
          test/install/chocolatey.ps1 -Package "$env:RUNNER_TEMP\chocolatey" `
            -Release "$env:RUNNER_TEMP\channel-files\release"

  npm:
    name: npm (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: fake-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24'
          - os: ubuntu-24.04-arm
            node: '24'
          - os: macos-latest
            node: '24'
          - os: macos-15-intel
            node: '24'
          - os: windows-latest
            node: '24'
          - os: ubuntu-latest
            node: '18'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Download the npm packages
        uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs

      # Verdaccio 5 runs on Node 18 too
      - name: Install Verdaccio, pnpm and bun
        run: |
          npm install --prefix "$RUNNER_TEMP/verdaccio" "verdaccio@$VERDACCIO_VERSION"
          npm install -g "pnpm@$PNPM_VERSION" "bun@$BUN_VERSION"

      - name: Test the npm packages
        run: node test/install/npm.mjs "$RUNNER_TEMP/npm-tarballs" "$RUNNER_TEMP/verdaccio/node_modules/verdaccio/bin/verdaccio"

  # The script tests that need the network or Verdaccio, which make
  # test-scripts skips
  script-tests:
    name: Script tests (network and Verdaccio)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Komac and Verdaccio
        run: |
          scripts/install-komac.sh "$RUNNER_TEMP/komac"
          echo "$RUNNER_TEMP/komac" >> "$GITHUB_PATH"
          npm install --prefix "$RUNNER_TEMP/verdaccio" "verdaccio@$VERDACCIO_VERSION"

      # Komac reads GITHUB_TOKEN; the run's token reads public repositories
      - name: Test the WinGet and Chocolatey checks
        env:
          RELEASE_TESTS_NETWORK: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: sh test/release/run.sh test/release/channel_published_network_test.sh

      - name: Test npm-publish.mjs
        run: |
          VERDACCIO="$RUNNER_TEMP/verdaccio/node_modules/verdaccio/bin/verdaccio" \
            sh test/release/run.sh test/release/npm_publish_test.sh

  # The two builds that scripts/check-rebuild.sh compares before a channel
  # publishes, each on its own runner in a full clone of this commit, for a
  # test tag: the release job's build, and the build of publish-channel.yml
  rebuild-release:
    name: Reproducibility (release build)
    runs-on: ubuntu-latest
    steps:
      # The commit itself, so both builds use the same one
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Tag the commit and prepare the build information
        run: |
          git tag v99.0.0
          echo "Test release notes" > "$RUNNER_TEMP/release-notes.md"
          scripts/build-info.sh >> "$GITHUB_ENV"
          make_latest=$(scripts/make-latest.sh v99.0.0)
          echo "MAKE_LATEST=$make_latest" >> "$GITHUB_ENV"

      # The release job's command, with publish added to --skip
      - name: Build the release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=publish,homebrew,scoop,aur --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GORELEASER_CURRENT_TAG: v99.0.0

      - name: Upload checksums.txt
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-release
          path: dist/checksums.txt
          retention-days: 1

  rebuild-channel:
    name: Reproducibility (channel build)
    runs-on: ubuntu-latest
    steps:
      # The commit itself, so both builds use the same one
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Tag the commit and prepare the build information
        run: |
          git tag v99.0.0
          scripts/build-info.sh >> "$GITHUB_ENV"
          make_latest=$(scripts/make-latest.sh v99.0.0)
          echo "MAKE_LATEST=$make_latest" >> "$GITHUB_ENV"

      # The command of publish-channel.yml
      - name: Rebuild the release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: v99.0.0

      - name: Upload checksums.txt
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-channel
          path: dist/checksums.txt
          retention-days: 1

  check-rebuild:
    name: Reproducibility (compare)
    needs: [rebuild-release, rebuild-channel]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download both checksums.txt files
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/rebuild
          pattern: rebuild-*

      - name: Compare the builds
        run: |
          scripts/check-rebuild.sh "$RUNNER_TEMP/rebuild/rebuild-channel/checksums.txt" \
            "$RUNNER_TEMP/rebuild/rebuild-release/checksums.txt"
