name: Packaging

# The install channel tests: they install the release assets of test
# snapshots, served by a fake release, on every platform the channels support
on:
  pull_request:
    paths:
      - '.goreleaser.yaml'
      - 'Makefile'
      - 'go.mod'
      - 'scripts/**'
      - 'npm/**'
      - 'packaging/**'
      - 'install.sh'
      - 'install.ps1'
      - 'test/install/**'
      - '.github/workflows/**'

env:
  # The toolchain line of go.mod; make check-versions checks it
  GO_VERSION: '1.27.2'
  GOTOOLCHAIN: 'go1.27.2'

permissions:
  contents: read

jobs:
  lint-install-scripts:
    name: Lint the install scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # checkbashisms comes with devscripts
      - name: Install shellcheck and checkbashisms
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck devscripts

      - name: Check the sh scripts
        run: |
          shellcheck -x -s sh install.sh test/install/run.sh
          checkbashisms install.sh test/install/run.sh

      # Windows PowerShell 5.1 reads a download without a charset as
      # ISO-8859-1, so install.ps1 must be ASCII
      - name: Check that install.ps1 is ASCII
        run: |
          if [ -n "$(LC_ALL=C tr -d '\000-\177' < install.ps1)" ]; then
            LC_ALL=C grep -n -P '[^\x00-\x7F]' install.ps1 >&2
            echo "install.ps1 has bytes that are not ASCII" >&2
            exit 1
          fi

      # The script writes its messages for the user with Write-Host
      - name: Analyze install.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost
          $results | Format-Table -AutoSize -Wrap
          if ($results) {
            exit 1
          }

  fake-release:
    name: Build the fake release
    runs-on: ubuntu-latest
    steps:
      # The release scripts read the repository's tags
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A stable version, and an older pre-release for the upgrade and
      # pre-release cases
      - name: Build the test snapshots
        run: |
          for version in 99.0.0 98.0.0-rc.1; do
            make release-snapshot SNAPSHOT_VERSION=$version
            scripts/stage-release.sh dist "$RUNNER_TEMP/release/v$version"
          done

      # The install scripts need only checksums.txt and the raw binaries
      - name: Upload the fake release
        uses: actions/upload-artifact@v4
        with:
          name: fake-release
          path: |
            ${{ runner.temp }}/release/*/checksums.txt
            ${{ runner.temp }}/release/*/ahasend-linux-*
            ${{ runner.temp }}/release/*/ahasend-darwin-*
            ${{ runner.temp }}/release/*/ahasend-windows-*
          retention-days: 1

  install-sh:
    name: install.sh (${{ matrix.os }}, ${{ matrix.shell }})
    needs: fake-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # sh is dash on Ubuntu
          - os: ubuntu-latest
            shell: sh
          - os: ubuntu-latest
            shell: bash
          - os: ubuntu-24.04-arm
            shell: sh
          - os: macos-latest
            shell: sh
          - os: macos-15-intel
            shell: sh
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download the fake release
        uses: actions/download-artifact@v4
        with:
          name: fake-release
          path: ${{ runner.temp }}/release

      - name: Build the fake release server
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/fake-release" ./test/install/fake-release

      # The Rosetta case runs install.sh as an x86_64 process
      - name: Install Rosetta
        if: matrix.os == 'macos-latest'
        run: /usr/bin/arch -x86_64 /usr/bin/true 2> /dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Test install.sh
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: sh test/install/run.sh "$RUNNER_TEMP/release" "$RUNNER_TEMP/fake-release"

  install-sh-alpine:
    name: install.sh (Alpine, busybox sh)
    needs: fake-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download the fake release
        uses: actions/download-artifact@v4
        with:
          name: fake-release
          path: ${{ runner.temp }}/release

      # Static, so it runs in the Alpine container
      - name: Build the fake release server
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/fake-release" ./test/install/fake-release

      # Alpine has busybox sh and wget, and no curl; a user other than root
      # cannot write to a read-only directory
      - name: Test install.sh
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/release:/release:ro" \
            -v "$RUNNER_TEMP/fake-release:/fake-release:ro" -w /src \
            alpine:3.22 sh test/install/run.sh /release /fake-release

  install-ps1:
    name: install.ps1 (${{ matrix.os }}, ${{ matrix.shell }})
    needs: fake-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        # Windows PowerShell 5.1 and PowerShell 7
        shell: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download the fake release
        uses: actions/download-artifact@v4
        with:
          name: fake-release
          path: ${{ runner.temp }}/release

      - name: Build the fake release server
        run: go build -o "$env:RUNNER_TEMP\fake-release.exe" ./test/install/fake-release

      # Windows PowerShell needs TLS 1.2 and the NuGet provider to install
      # modules
      - name: Install Pester
        run: |
          if ($PSVersionTable.PSEdition -eq 'Desktop') {
            [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Test install.ps1
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $data = @{ Release = "$env:RUNNER_TEMP\release"; Server = "$env:RUNNER_TEMP\fake-release.exe" }
          $config = New-PesterConfiguration
          $config.Run.Container = New-PesterContainer -Path test/install/install.Tests.ps1 -Data $data
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
